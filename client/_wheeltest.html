<!DOCTYPE html><html><body style="margin:0"><canvas id="c" width="1200" height="700"></canvas>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { loadCarModels, makeCar } from '/js/cars.js';
await loadCarModels();
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fc5e8);
s.add(new THREE.HemisphereLight(0xffffff, 0x555544, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(5,10,7); s.add(d);
const g = new THREE.Mesh(new THREE.PlaneGeometry(50,50), new THREE.MeshLambertMaterial({color:0x7a8c5a})); g.rotation.x=-Math.PI/2; s.add(g);
const car = makeCar(q.get('type') || 'sedan', +(q.get('color') || 0xc62828)); s.add(car);
for (const w of car.userData.wheels) w.rotation.x += +(q.get('spin') || 0);
const v = { side: [9,1.2,0], front: [4,1.6,7], rear: [-4,1.8,-7], top: [5,5,5], close: [3.2,0.7,2.6] }[q.get('view') || 'side'];
const cam = new THREE.PerspectiveCamera(35, 1200/700, 0.1, 100); cam.position.set(...v); cam.lookAt(0, 0.7, q.get('view')==='close'?1.3:0);
r.render(s, cam); window.done = true;
</script></body></html>
